# Local development only — a disposable Postgres instance, NOT a Supabase
# stand-in. Point DATABASE_URL at your real Supabase project instead (see
# .env.example) if you want to test against real data; use this compose file
# when you just want the backend to boot against *some* reachable Postgres.
#
#   docker compose up --build
#
# The frontend is intentionally not included here — it has its own dev
# server (see the repo root README/AGENTS.md) and gains nothing from being
# orchestrated alongside this backend.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aval
      POSTGRES_PASSWORD: aval
      POSTGRES_DB: aval
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aval"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      DATABASE_URL: jdbc:postgresql://postgres:5432/aval
      DATABASE_USERNAME: aval
      DATABASE_PASSWORD: aval
      CORS_ALLOWED_ORIGINS: http://localhost:8080
      # Supabase Auth vars intentionally left unset here — see .env.example.
      # Without them, /api/v1/me correctly rejects every token (no bypass).
    depends_on:
      postgres:
        condition: service_healthy
